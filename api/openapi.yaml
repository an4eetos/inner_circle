openapi: 3.0.3
info:
  title: Inner Circle API
  version: 0.1.0
  description: |
    HTTP contract for the Inner Circle backend. This file is the source of truth:
    edit it, run `make gen`, then implement. Errors use RFC 9457
    `application/problem+json` with a stable `code` field.
servers:
  - url: http://localhost:18080
    description: Local development
tags:
  - name: system
    description: Liveness and readiness
paths:
  /v1/healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: Liveness check
      description: Returns 200 while the process is up. Does not touch dependencies.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /v1/readyz:
    get:
      operationId: getReadyz
      tags: [system]
      summary: Readiness check
      description: Returns 200 when the API can serve traffic (database reachable), 503 otherwise.
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A dependency is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status, version, time]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Build version (git revision or release tag)
          example: 0.1.0+4e9fe0d
        time:
          type: string
          format: date-time
          description: Server time (UTC)
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          $ref: "#/components/schemas/ReadinessChecks"
    ReadinessChecks:
      type: object
      required: [database]
      properties:
        database:
          type: string
          enum: [ok]
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: about:blank
        title:
          type: string
          description: Short human-readable summary
          example: Not Found
        status:
          type: integer
          description: HTTP status code
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
        instance:
          type: string
          description: URI reference identifying this occurrence
        code:
          type: string
          description: Stable machine-readable error code
          example: not_found
        request_id:
          type: string
          description: Request ID, also returned in the X-Request-ID header
