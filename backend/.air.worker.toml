# Hot reload for the River worker in local dev: `make dev` (or `make worker`).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/worker ./cmd/worker"
  entrypoint = ["./tmp/worker"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "tools", "cmd/api", "cmd/migrate", "migrations"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  kill_delay = "10s"
  send_interrupt = true

[log]
  main_only = true
